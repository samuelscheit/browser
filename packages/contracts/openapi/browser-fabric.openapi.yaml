openapi: 3.1.0
info:
  title: Browser Fabric Control Plane
  version: 0.1.0
  description: |
    Private Browser Fabric API. Calls require a per-principal Basic credential at the ingress and a project-scoped principal.
    Raw CDP endpoints are short-lived signed capabilities scoped to exactly one browser session.
servers:
  - url: https://fabric.internal.example/v1
security:
  - fabricBasicAuth: []
paths:
  /browser-sessions:
    post:
      operationId: createBrowserSession
      summary: Queue a managed raw-CDP browser session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSessionCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      operationId: getBrowserSession
      responses:
        '200': { description: Browser session, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/heartbeat:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: heartbeatBrowserSession
      responses:
        '200': { description: Heartbeat accepted, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/release:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: releaseBrowserSession
      responses:
        '200': { description: Released, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/cancel:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: cancelBrowserSession
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/events:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      operationId: listBrowserSessionEvents
      responses:
        '200': { description: Ordered events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/artifacts:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      operationId: listBrowserSessionArtifacts
      responses:
        '200': { description: Immutable session artifacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Artifact' } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: uploadBrowserSessionArtifact
      parameters:
        - { $ref: '#/components/parameters/ArtifactKind' }
        - { $ref: '#/components/parameters/ArtifactLabel' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary, maxLength: 33554432 } }
          application/vnd.browser-fabric.media-manifest+json: { schema: { type: string, format: binary, maxLength: 65536 } }
      responses:
        '201': { description: Immutable artifact created, content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /browser-sessions/{sessionId}/input-requests:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      operationId: listBrowserSessionInputRequests
      description: List non-secret input request metadata and worker public keys for the session.
      responses:
        '200': { description: Input requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InputRequest' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs:
    post:
      operationId: createJob
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      operationId: getJob
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/cancel:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      operationId: cancelJob
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/resume:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      operationId: resumeJob
      responses:
        '200': { description: Resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/events:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      operationId: listJobEvents
      responses:
        '200': { description: Ordered events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/artifacts:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      operationId: listJobArtifacts
      responses:
        '200': { description: Immutable job artifacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Artifact' } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: uploadJobArtifact
      parameters:
        - { $ref: '#/components/parameters/ArtifactKind' }
        - { $ref: '#/components/parameters/ArtifactLabel' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary, maxLength: 33554432 } }
          application/vnd.browser-fabric.media-manifest+json: { schema: { type: string, format: binary, maxLength: 65536 } }
      responses:
        '201': { description: Immutable artifact created, content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/media-playback:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      operationId: issueMediaPlaybackEndpoint
      description: |
        Issue short-lived opaque HLS and direct-media URLs for a ready `media-playback` job.
        The caller must be authorized for the project. The returned capability is bound to the
        exact active worker attempt and contains no provider URL, cookie, or request headers.
      responses:
        '201': { description: Playback capability issued, content: { application/json: { schema: { $ref: '#/components/schemas/MediaPlaybackEndpoint' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/input-requests:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      operationId: listJobInputRequests
      description: List non-secret input request metadata and worker public keys for the job.
      responses:
        '200': { description: Input requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InputRequest' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /media-playback/{jobId}/master.m3u8:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
      - { name: cap, in: query, required: true, schema: { type: string }, description: Opaque attempt-scoped playback capability. }
    get:
      operationId: getMediaPlaybackMaster
      security: []
      responses:
        '200': { description: Capability-gated HLS master playlist }
        default: { $ref: '#/components/responses/Problem' }
  /media-playback/{jobId}/media:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
      - { name: cap, in: query, required: true, schema: { type: string }, description: Opaque attempt-scoped playback capability. }
      - { name: Range, in: header, required: false, schema: { type: string } }
    get:
      operationId: getMediaPlaybackDirectMedia
      security: []
      responses:
        '200': { description: Full direct-media response }
        '206': { description: Byte-ranged direct-media response }
        default: { $ref: '#/components/responses/Problem' }
  /media-playback/{jobId}/resource/{resource}:
    parameters:
      - { $ref: '#/components/parameters/JobId' }
      - { name: resource, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+\.(m3u8|ts|key|mp4)$' } }
      - { name: cap, in: query, required: true, schema: { type: string }, description: Opaque attempt-scoped playback capability. }
      - { name: Range, in: header, required: false, schema: { type: string } }
    get:
      operationId: getMediaPlaybackResource
      security: []
      responses:
        '200': { description: Capability-gated HLS resource }
        '206': { description: Byte-ranged cached HLS resource }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/media-manifests:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, pattern: '^project_' } }
      - { $ref: '#/components/parameters/ArtifactKind' }
      - { $ref: '#/components/parameters/ArtifactLabel' }
      - { $ref: '#/components/parameters/ArtifactPolicyRef' }
    post:
      operationId: uploadMediaManifest
      description: |
        Create a project-scoped immutable media_manifest before its consuming media-only job exists.
        This is the sole ownerless artifact form; provider URLs are parsed and validated before
        storage, and the response never includes an object-store key.
      requestBody:
        required: true
        content:
          application/vnd.browser-fabric.media-manifest+json:
            schema: { type: string, format: binary, maxLength: 65536 }
      responses:
        '201': { description: Immutable media manifest created, content: { application/json: { schema: { $ref: '#/components/schemas/Artifact' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /profiles:
    post:
      operationId: createProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listProfiles
      parameters: [{ name: project, in: query, required: true, schema: { type: string, pattern: '^project_' } }]
      responses:
        '200': { description: Profiles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /profiles/{profileRef}:
    parameters: [{ name: profileRef, in: path, required: true, schema: { type: string, pattern: '^profile_' } }]
    get:
      operationId: getProfile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /profiles/{profileRef}/grants:
    parameters: [{ name: profileRef, in: path, required: true, schema: { type: string, pattern: '^profile_' } }]
    post:
      operationId: grantProfile
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [project], properties: { project: { type: string, pattern: '^project_' } } } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /profiles/{profileRef}/revoke:
    parameters: [{ name: profileRef, in: path, required: true, schema: { type: string, pattern: '^profile_' } }]
    post:
      operationId: revokeProfile
      responses:
        '200': { description: Revoked profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /profiles/{profileRef}/relocate:
    parameters: [{ name: profileRef, in: path, required: true, schema: { type: string, pattern: '^profile_' } }]
    post:
      operationId: relocateProfile
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [targetWorkerId, verifiedChecksum], properties: { targetWorkerId: { type: string, pattern: '^worker_' }, verifiedChecksum: { type: string, pattern: '^sha256:' } } } } }
      responses:
        '200': { description: Relocated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /workers:
    get:
      operationId: listWorkers
      responses:
        '200': { description: Workers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Worker' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /workers/{workerId}/health:
    parameters: [{ name: workerId, in: path, required: true, schema: { type: string, pattern: '^worker_' } }]
    post:
      operationId: setWorkerHealth
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [health], properties: { health: { type: string, enum: [healthy, degraded, offline, draining] } } } } }
      responses:
        '200': { description: Worker, content: { application/json: { schema: { $ref: '#/components/schemas/Worker' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /input-requests/{requestId}:
    parameters: [{ name: requestId, in: path, required: true, schema: { type: string, pattern: '^input-request_' } }]
    get:
      operationId: getEphemeralInputRequest
      description: Return non-secret input-request metadata and the worker encryption public key.
      responses:
        '200': { description: Input request metadata, content: { application/json: { schema: { $ref: '#/components/schemas/InputRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /input-requests/{requestId}/envelope:
    parameters: [{ name: requestId, in: path, required: true, schema: { type: string, pattern: '^input-request_' } }]
    post:
      operationId: provideEncryptedEphemeralInput
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EphemeralInputEnvelope' } } }
      responses:
        '200': { description: Ciphertext accepted, content: { application/json: { schema: { $ref: '#/components/schemas/InputRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /artifacts/{artifactId}:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string, pattern: '^artifact_' } }
      - { name: project, in: query, required: true, schema: { type: string, pattern: '^project_' } }
      - { name: ttlSeconds, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 900, default: 60 } }
    get:
      operationId: getArtifactDownload
      description: Return a short-lived object-store URL only after project authorization; object keys and credentials are never returned.
      responses:
        '200': { description: Bounded artifact download URL, content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactDownload' } } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    fabricBasicAuth: { type: http, scheme: basic }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, pattern: '^browser-session_' } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, pattern: '^job_' } }
    ArtifactKind: { name: X-Fabric-Artifact-Kind, in: header, required: true, schema: { type: string, enum: [screenshot, mhtml, trace, har, download, video, log, media_manifest] } }
    ArtifactLabel: { name: X-Fabric-Artifact-Label, in: header, required: false, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$' } }
    ArtifactPolicyRef: { name: X-Fabric-Artifact-Policy-Ref, in: header, required: false, schema: { type: string, pattern: '^artifact-policy_' }, description: Defaults to artifact-policy_standard-30-days@1. }
  responses:
    Problem:
      description: RFC 9457 problem response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    BrowserSessionCreate:
      type: object
      required: [project, idempotencyKey, runtime, browserRecipeRef, leaseMode, egressPolicyRef, artifactPolicyRef, ttlSeconds]
      properties:
        project: { type: string, pattern: '^project_' }
        idempotencyKey: { type: string }
        runtime: { type: string, enum: [chromium-cdp, patchright, rebrowser-puppeteer, playwright-social, companion, media-relay, media-playback] }
        browserRecipeRef: { type: string, pattern: '^recipe_' }
        profileRef: { type: string, pattern: '^profile_' }
        leaseMode: { type: string, enum: [writer, interactive, clone] }
        egressPolicyRef: { type: string, pattern: '^egress_' }
        artifactPolicyRef: { type: string, pattern: '^artifact-policy_' }
        metadata: { type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }
        ttlSeconds: { type: integer, minimum: 60, maximum: 14400 }
    BrowserSession:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string, pattern: '^browser-session_' }
        status: { type: string, enum: [queued, allocating, ready, active, releasing, released, cancelled, failed, timed_out] }
        cdpEndpoint: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        workerId: { type: string, pattern: '^worker_' }
        profileLease: { type: object, properties: { id: { type: string, pattern: '^browser-lease_' }, mode: { type: string }, profileRef: { type: string } } }
    JobCreate:
      type: object
      required: [project, idempotencyKey, recipeRef, operation, egressPolicyRef, artifactPolicyRef]
      properties:
        project: { type: string, pattern: '^project_' }
        idempotencyKey: { type: string }
        recipeRef: { type: string, pattern: '^recipe_' }
        operation: { type: object }
        profileRef: { type: string, pattern: '^profile_' }
        leaseMode: { type: string, enum: [writer, interactive, clone] }
        egressPolicyRef: { type: string, pattern: '^egress_' }
        artifactPolicyRef: { type: string, pattern: '^artifact-policy_' }
        callback: { type: object, properties: { url: { type: string, format: uri }, eventSecretRef: { type: string } }, required: [url] }
        ttlSeconds: { type: integer, minimum: 60, maximum: 14400 }
        metadata: { type: object, additionalProperties: { type: [string, number, boolean, 'null'] } }
    Job:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string, pattern: '^job_' }
        status: { type: string, enum: [queued, running, awaiting_input, awaiting_manual, succeeded, failed, blocked_challenge, auth_required, timed_out, cancelled] }
        expiresAt: { type: string, format: date-time }
        workerId: { type: string, pattern: '^worker_' }
        result: { type: object }
        failureReason: { type: string }
    MediaPlaybackEndpoint:
      type: object
      required: [masterUrl, mediaUrl, expiresAt]
      properties:
        masterUrl: { type: string, format: uri, description: Use when the encrypted source declared HLS delivery. }
        mediaUrl: { type: string, format: uri, description: Use when the encrypted source declared direct MP4/media delivery. }
        expiresAt: { type: string, format: date-time }
    Artifact:
      type: object
      required: [id, project, kind, sha256, mimeType, sizeBytes, createdAt, expiresAt]
      properties:
        id: { type: string, pattern: '^artifact_' }
        project: { type: string, pattern: '^project_' }
        sessionId: { type: string, pattern: '^browser-session_' }
        jobId: { type: string, pattern: '^job_' }
        profileRef: { type: string, pattern: '^profile_' }
        kind: { type: string, enum: [screenshot, mhtml, trace, har, download, video, log, media_manifest] }
        sha256: { type: string, pattern: '^sha256:[A-Fa-f0-9]{64}$' }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ArtifactDownload:
      type: object
      required: [artifact, url, expiresAt]
      properties:
        artifact: { $ref: '#/components/schemas/Artifact' }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Event:
      type: object
      required: [id, sequence, type, createdAt]
      properties:
        id: { type: string }
        sequence: { type: integer }
        type: { type: string }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    ProfileCreate:
      type: object
      required: [ref, ownerProject, workerId, volumeName, profileFamily, grants]
      properties:
        ref: { type: string, pattern: '^profile_' }
        ownerProject: { type: string, pattern: '^project_' }
        workerId: { type: string, pattern: '^worker_' }
        volumeName: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$' }
        profileFamily: { type: string }
        grants: { type: array, items: { type: string, pattern: '^project_' } }
        volumeGeneration: { type: integer, minimum: 1 }
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileCreate'
        - type: object
          required: [status, volumeGeneration]
          properties:
            status: { type: string, enum: [active, unhealthy, relocating, revoked] }
    Worker:
      type: object
      required: [id, endpoint, cdpRelayEndpoint, capabilities, capacity, health, isLocal, resourceLimits]
      properties:
        id: { type: string, pattern: '^worker_' }
        endpoint: { type: string, format: uri }
        cdpRelayEndpoint: { type: string, format: uri }
        mediaPlaybackEndpoint: { type: string, format: uri, description: Private worker relay endpoint; never returned by public job responses. }
        capacity: { type: integer, minimum: 0, maximum: 3 }
        health: { type: string, enum: [healthy, degraded, offline, draining] }
        isLocal: { type: boolean }
        capabilities: { type: object }
        resourceLimits: { type: object }
    InputRequest:
      type: object
      required: [id, project, field, fieldType, status, expiresAt]
      properties:
        id: { type: string, pattern: '^input-request_' }
        project: { type: string, pattern: '^project_' }
        leaseId: { type: string, pattern: '^browser-lease_' }
        mediaAttemptId: { type: string, pattern: '^attempt_', description: Present only for encrypted media-playback source handoffs. }
        field: { type: string }
        fieldType: { type: string, enum: [password, otp, captcha_provider_credential, proxy_credential, form_value, media_playback_source] }
        status: { type: string, enum: [pending, supplied, consumed, expired, cancelled] }
        expiresAt: { type: string, format: date-time }
        workerId: { type: string, pattern: '^worker_' }
        workerInputEncryptionPublicKeyPem: { type: string, description: Public key used by the application to encrypt the one-shot input envelope. }
    EphemeralInputEnvelope:
      type: object
      required: [version, algorithm, requestId, workerId, expiresAt, wrappedKey, iv, tag, ciphertext]
      properties:
        version: { type: integer, const: 1 }
        algorithm: { type: string, const: rsa-oaep-sha256+a256gcm }
        requestId: { type: string, pattern: '^input-request_' }
        workerId: { type: string, pattern: '^worker_' }
        expiresAt: { type: string, format: date-time }
        wrappedKey: { type: string, writeOnly: true }
        iv: { type: string, writeOnly: true }
        tag: { type: string, writeOnly: true }
        ciphertext: { type: string, writeOnly: true }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
