  fabric_edge_origin_client_key: { file: "${FABRIC_SECRETS_DIR:-./secrets}/fabric_edge_origin_client_key" }
  fabric_worker_ca: { file: "${FABRIC_SECRETS_DIR:-./secrets}/fabric_worker_ca" }
