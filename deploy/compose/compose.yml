# Browser Fabric: a self-hosted, single-host deployment with Docker Compose.
#
#   ./bootstrap-secrets.sh            # once: certificates, keys, passwords, provisioning manifest
#   cp .env.example .env              # then adjust
#   docker compose up -d --build
#
# Static services sit on private bridge networks with fixed names, so the worker manager can create
# short-lived, labelled browser/media containers per lease without Swarm or a registry. Only
# fabric-edge publishes a port (loopback by default); put a TLS terminator in front of it. See
# README.md in this directory.
#
# Docker mounts every tmpfs as root:root. Services running as a non-root user own their restricted
# (mode=1770) tmpfs through uid=/gid= options, otherwise they have no writable temp directory;
# scripts/compose-tmpfs-ownership.ts enforces this for every service.
name: browser-fabric

x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-app-environment: &app-environment
  NODE_ENV: production
  FABRIC_GATEWAY_BASE_URL: ${FABRIC_GATEWAY_BASE_URL:?set FABRIC_GATEWAY_BASE_URL}
  FABRIC_MAX_ACTIVE_BROWSER_LEASES: ${FABRIC_MAX_ACTIVE_BROWSER_LEASES:-4}
  # The deployment's own recipes, egress policies, challenge sets and projects (docs/catalog.md).
  FABRIC_CATALOG_FILE: /etc/browser-fabric/catalog.json

x-catalog-mount: &catalog-mount
  type: bind
  source: ${FABRIC_CATALOG_PATH:-./catalog.json}
  target: /etc/browser-fabric/catalog.json
  read_only: true

x-app-tmpfs: &app-tmpfs
  - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=10001,gid=10001

# Worker agents carry only registration/heartbeat identity. The manager creates the actual browser
# container per lease with no application secrets or published ports.
x-worker-agent: &worker-agent
  <<: *hardened
  image: browser-fabric-browser:local
  user: '10001:10001'
  networks: [fabric-workers]
  depends_on:
    fabric-worker-manager:
      condition: service_started
  command: [bun, apps/local-agent/src/server.ts]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1770,uid=10001,gid=10001
  mem_limit: 256m
  pids_limit: 256

x-worker-agent-environment: &worker-agent-environment
  FABRIC_MANAGED_MODE: '1'
  FABRIC_WORKER_MANAGER_URL: https://fabric-worker-manager:8082
  FABRIC_WORKER_CA_FILE: /run/secrets/fabric_worker_ca
  FABRIC_WORKER_CLIENT_CA_FILE: /run/secrets/fabric_worker_ca
  FABRIC_ASSIGNMENT_PUBLIC_KEY_FILE: /run/secrets/fabric_assignment_public_key

services:
  fabric-postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    networks: [fabric-control]
    secrets: [fabric_db_password]
    environment:
      POSTGRES_DB: browser_fabric
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD_FILE: /run/secrets/fabric_db_password
    volumes:
      - fabric_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fabric -d browser_fabric]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 1024m
    pids_limit: 512

  # Bundled S3-compatible object store for artifacts. To use an external S3 service instead, point
  # FABRIC_OBJECT_STORE_ENDPOINT at it, provide the Fabric credential files and drop these two services.
  fabric-object-store:
    image: docker.io/rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: unless-stopped
    # RustFS reads its root credential files and owns its image data path as root; every capability
    # except the DAC check is dropped.
    user: '0:0'
    command: [/data]
    networks: [fabric-control]
    secrets: [object_store_root_access_key, object_store_root_secret_key]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/object_store_root_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/object_store_root_secret_key
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_REGION: us-east-1
      RUSTFS_VOLUMES: /data
    volumes:
      - fabric_object_store_data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:9000/health/ready >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    pids_limit: 256

  fabric-object-store-init:
    image: docker.io/rustfs/rc:v0.1.36@sha256:d6de0f9e756939553ea18265f77056da034dae536671a57a07f1354bb7333d23
    restart: 'no'
    user: '0:0'
    networks: [fabric-control]
    depends_on:
      fabric-object-store:
        condition: service_healthy
    secrets: [object_store_root_access_key, object_store_root_secret_key, fabric_object_store_access_key, fabric_object_store_secret_key]
    environment:
      OBJECT_STORE_ENDPOINT: http://fabric-object-store:9000
      FABRIC_OBJECT_STORE_BUCKET: fabric-artifacts
    entrypoint: [/bin/sh, /opt/fabric/object-store-init.sh]
    volumes:
      - type: bind
        source: ./object-store-init.sh
        target: /opt/fabric/object-store-init.sh
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64

  # Durable profile volumes must exist, owned by the unprivileged browser user, before the
  # provisioning manifest makes a profile refer to them. Add a line per volume your manifest adds.
  fabric-volume-bootstrap:
    image: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: 'no'
    network_mode: none
    command: [/bin/sh, -ceu, 'for volume in /profiles/*; do mkdir -p "$$volume"; chown -R 10001:10001 "$$volume"; done']
    volumes:
      - profile_chromium:/profiles/profile_chromium
      - profile_interactive:/profiles/profile_interactive
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32

  # The sole database bootstrap: applies the schema and idempotently registers projects, principals,
  # workers and durable profiles from the provisioning manifest bootstrap-secrets.sh generated.
  fabric-provisioner:
    image: browser-fabric-app:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    user: '10001:10001'
    networks: [fabric-control]
    depends_on:
      fabric-postgres:
        condition: service_healthy
      fabric-volume-bootstrap:
        condition: service_completed_successfully
    secrets: [fabric_db_url, fabric_capability_secret, fabric_provision_manifest]
    environment:
      <<: *app-environment
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
    command: [bun, apps/worker-manager/src/provision-fabric.ts, --manifest, /run/secrets/fabric_provision_manifest]
    volumes: [*catalog-mount]
    read_only: true
    tmpfs: *app-tmpfs
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 192

  fabric-api:
    <<: *hardened
    image: browser-fabric-app:local
    user: '10001:10001'
    networks: [fabric-control]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
      fabric-object-store-init:
        condition: service_completed_successfully
    secrets:
      - fabric_db_url
      - fabric_capability_secret
      - fabric_api_cert
      - fabric_api_key
      - fabric_origin_client_ca
      - fabric_input_broker_api_client_cert
      - fabric_input_broker_api_client_key
      - fabric_input_broker_client_ca
      - fabric_object_store_access_key
      - fabric_object_store_secret_key
      - fabric_media_playback_private_key
    environment:
      <<: *app-environment
      PORT: '8080'
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
      FABRIC_API_CERT_FILE: /run/secrets/fabric_api_cert
      FABRIC_API_KEY_FILE: /run/secrets/fabric_api_key
      FABRIC_API_CLIENT_CA_FILE: /run/secrets/fabric_origin_client_ca
      FABRIC_INPUT_BROKER_URL: https://fabric-input-broker:8443
      FABRIC_INPUT_BROKER_CLIENT_CERT_FILE: /run/secrets/fabric_input_broker_api_client_cert
      FABRIC_INPUT_BROKER_CLIENT_KEY_FILE: /run/secrets/fabric_input_broker_api_client_key
      FABRIC_INPUT_BROKER_CLIENT_CA_FILE: /run/secrets/fabric_input_broker_client_ca
      FABRIC_OBJECT_STORE_ENDPOINT: ${FABRIC_OBJECT_STORE_ENDPOINT:-http://fabric-object-store:9000}
      FABRIC_OBJECT_STORE_BUCKET: fabric-artifacts
      FABRIC_OBJECT_STORE_REGION: us-east-1
      FABRIC_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/fabric_object_store_access_key
      FABRIC_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/fabric_object_store_secret_key
      FABRIC_MEDIA_PLAYBACK_PRIVATE_KEY_FILE: /run/secrets/fabric_media_playback_private_key
      FABRIC_MEDIA_PLAYBACK_BASE_URL: ${FABRIC_MEDIA_PLAYBACK_BASE_URL:?set FABRIC_MEDIA_PLAYBACK_BASE_URL}
    command: [bun, apps/api/src/server.ts]
    volumes: [*catalog-mount]
    tmpfs: *app-tmpfs
    mem_limit: 1024m
    pids_limit: 256

  # Browser WebSocket relays are in-memory. A single replica is deliberate: a worker relay and its
  # public CDP peer must land in the same process.
  fabric-cdp-gateway:
    <<: *hardened
    image: browser-fabric-app:local
    user: '10001:10001'
    networks: [fabric-control, fabric-workers]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
    secrets: [fabric_db_url, fabric_capability_secret, fabric_cdp_gateway_cert, fabric_cdp_gateway_key, fabric_origin_client_ca]
    environment:
      <<: *app-environment
      PORT: '8081'
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
      FABRIC_CDP_GATEWAY_CERT_FILE: /run/secrets/fabric_cdp_gateway_cert
      FABRIC_CDP_GATEWAY_KEY_FILE: /run/secrets/fabric_cdp_gateway_key
      FABRIC_CDP_GATEWAY_CLIENT_CA_FILE: /run/secrets/fabric_origin_client_ca
    command: [bun, apps/cdp-gateway/src/server.ts]
    volumes: [*catalog-mount]
    tmpfs: *app-tmpfs
    mem_limit: 768m
    pids_limit: 256

  fabric-media-playback-gateway:
    <<: *hardened
    image: browser-fabric-app:local
    user: '10001:10001'
    networks: [fabric-control, fabric-workers]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
    secrets: [fabric_db_url, fabric_capability_secret, fabric_media_playback_public_key, fabric_media_playback_gateway_cert, fabric_media_playback_gateway_key, fabric_origin_client_ca]
    environment:
      <<: *app-environment
      PORT: '8084'
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
      FABRIC_MEDIA_PLAYBACK_PUBLIC_KEY_FILE: /run/secrets/fabric_media_playback_public_key
      FABRIC_MEDIA_PLAYBACK_GATEWAY_CERT_FILE: /run/secrets/fabric_media_playback_gateway_cert
      FABRIC_MEDIA_PLAYBACK_GATEWAY_KEY_FILE: /run/secrets/fabric_media_playback_gateway_key
      FABRIC_MEDIA_PLAYBACK_GATEWAY_CLIENT_CA_FILE: /run/secrets/fabric_origin_client_ca
    command: [bun, apps/media-playback-gateway/src/server.ts]
    volumes: [*catalog-mount]
    tmpfs: *app-tmpfs
    mem_limit: 768m
    pids_limit: 192

  fabric-scheduler:
    <<: *hardened
    image: browser-fabric-app:local
    user: '10001:10001'
    networks: [fabric-control, fabric-workers]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
    secrets: [fabric_db_url, fabric_capability_secret]
    environment:
      <<: *app-environment
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
    command: [bun, apps/scheduler/src/index.ts]
    volumes: [*catalog-mount]
    tmpfs: *app-tmpfs
    mem_limit: 512m
    pids_limit: 192

  # The only container with the Docker socket. It creates constrained, unpublished browser/media
  # containers and attaches them only to the fixed networks below.
  fabric-worker-manager:
    image: browser-fabric-manager:local
    build:
      context: ../..
      dockerfile: apps/worker-manager/Dockerfile
    restart: unless-stopped
    user: '0:0'
    networks: [fabric-control, fabric-workers, fabric-egress]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
      fabric-object-store-init:
        condition: service_completed_successfully
    secrets:
      - fabric_db_url
      - fabric_capability_secret
      - fabric_worker_ca
      - fabric_assignment_private_key
      - fabric_input_broker_manager_client_cert
      - fabric_input_broker_manager_client_key
      - fabric_input_broker_client_ca
      - fabric_worker_manager_cert
      - fabric_worker_manager_key
      - fabric_object_store_access_key
      - fabric_object_store_secret_key
      - fabric_media_result_secret
      - deathbycaptcha_username
      - deathbycaptcha_password
      - anticaptcha_client_key
    environment:
      <<: *app-environment
      PORT: '8082'
      FABRIC_DB_URL_FILE: /run/secrets/fabric_db_url
      FABRIC_CAPABILITY_SECRET_FILE: /run/secrets/fabric_capability_secret
      FABRIC_WORKER_CA_FILE: /run/secrets/fabric_worker_ca
      FABRIC_ASSIGNMENT_PRIVATE_KEY_FILE: /run/secrets/fabric_assignment_private_key
      FABRIC_INPUT_BROKER_URL: https://fabric-input-broker:8443
      FABRIC_INPUT_BROKER_CLIENT_CERT_FILE: /run/secrets/fabric_input_broker_manager_client_cert
      FABRIC_INPUT_BROKER_CLIENT_KEY_FILE: /run/secrets/fabric_input_broker_manager_client_key
      FABRIC_INPUT_BROKER_CLIENT_CA_FILE: /run/secrets/fabric_input_broker_client_ca
      FABRIC_WORKER_MANAGER_CERT_FILE: /run/secrets/fabric_worker_manager_cert
      FABRIC_WORKER_MANAGER_KEY_FILE: /run/secrets/fabric_worker_manager_key
      FABRIC_WORKER_MANAGER_CLIENT_CA_FILE: /run/secrets/fabric_worker_ca
      FABRIC_CHROMIUM_WORKER_IMAGE: browser-fabric-browser:local
      FABRIC_CHROMIUM_SECCOMP_PROFILE: /etc/browser-fabric/chromium-userns-seccomp.json
      FABRIC_PATCHRIGHT_WORKER_IMAGE: browser-fabric-browser:local
      FABRIC_REBROWSER_WORKER_IMAGE: browser-fabric-browser:local
      FABRIC_MEDIA_WORKER_IMAGE: browser-fabric-media:local
      FABRIC_VOLUME_HELPER_IMAGE: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      FABRIC_DOCKER_NETWORK_CONTROL: ${FABRIC_DOCKER_NETWORK_CONTROL:-browser-fabric-control}
      FABRIC_DOCKER_NETWORK_WORKERS: ${FABRIC_DOCKER_NETWORK_WORKERS:-browser-fabric-workers}
      FABRIC_DOCKER_NETWORK_EGRESS: ${FABRIC_DOCKER_NETWORK_EGRESS:-browser-fabric-egress}
      FABRIC_EGRESS_PROXY_HOST: fabric-egress-sidecar
      FABRIC_EGRESS_PAC_BASE_URL: http://fabric-egress-sidecar:8080
      FABRIC_OBJECT_STORE_ENDPOINT: ${FABRIC_OBJECT_STORE_ENDPOINT:-http://fabric-object-store:9000}
      FABRIC_OBJECT_STORE_BUCKET: fabric-artifacts
      FABRIC_OBJECT_STORE_REGION: us-east-1
      FABRIC_OBJECT_STORE_ACCESS_KEY_FILE: /run/secrets/fabric_object_store_access_key
      FABRIC_OBJECT_STORE_SECRET_KEY_FILE: /run/secrets/fabric_object_store_secret_key
      FABRIC_MEDIA_RESULT_SECRET_FILE: /run/secrets/fabric_media_result_secret
      FABRIC_MEDIA_RESULT_PORT: '8083'
      FABRIC_MEDIA_RESULT_BASE_URL: http://fabric-worker-manager:8083
      FABRIC_DEATHBYCAPTCHA_USERNAME_FILE: /run/secrets/deathbycaptcha_username
      FABRIC_DEATHBYCAPTCHA_PASSWORD_FILE: /run/secrets/deathbycaptcha_password
      FABRIC_ANTICAPTCHA_CLIENT_KEY_FILE: /run/secrets/anticaptcha_client_key
    command: [bun, apps/worker-manager/src/server.ts]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The Docker CLI in this container reads the seccomp JSON and sends it with each browser
      # container create request; the path is the one the manager approves.
      - type: bind
        source: ./chromium-userns-seccomp.json
        target: /etc/browser-fabric/chromium-userns-seccomp.json
        read_only: true
      - *catalog-mount
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1770
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256

  fabric-input-broker:
    <<: *hardened
    image: browser-fabric-app:local
    user: '10001:10001'
    networks: [fabric-control]
    depends_on:
      fabric-provisioner:
        condition: service_completed_successfully
    secrets: [fabric_input_broker_cert, fabric_input_broker_key, fabric_input_broker_client_ca]
    environment:
      NODE_ENV: production
      PORT: '8443'
      FABRIC_INPUT_BROKER_CERT_FILE: /run/secrets/fabric_input_broker_cert
      FABRIC_INPUT_BROKER_KEY_FILE: /run/secrets/fabric_input_broker_key
      FABRIC_INPUT_BROKER_CLIENT_CA_FILE: /run/secrets/fabric_input_broker_client_ca
    command: [bun, apps/input-broker/src/index.ts]
    tmpfs: *app-tmpfs
    mem_limit: 256m
    pids_limit: 128

  # The only Fabric service on a non-internal network besides the edge. Browser containers reach
  # the internet only through its PAC/proxy listeners.
  fabric-egress-sidecar:
    <<: *hardened
    image: browser-fabric-egress:local
    build:
      context: ../..
      dockerfile: deploy/compose/egress-sidecar.Dockerfile
    user: '10001:10001'
    networks: [fabric-egress, fabric-egress-external]
    secrets: [egress_proxy_upstreams]
    environment:
      NODE_ENV: production
      FABRIC_EGRESS_CONFIG: /etc/browser-fabric/egress-sidecar.json
      FABRIC_EGRESS_PAC_PORT: '8080'
      FABRIC_EGRESS_PAC_HOST: fabric-egress-sidecar
    command: [bun, apps/egress-sidecar/src/server.ts]
    volumes:
      - type: bind
        source: ${FABRIC_EGRESS_CONFIG_PATH:-./egress-sidecar.json}
        target: /etc/browser-fabric/egress-sidecar.json
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1770,uid=10001,gid=10001
    mem_limit: 1024m
    pids_limit: 512

  # Optional: `docker compose --profile tor up -d` serves the `egress_tor@1` policy.
  fabric-tor:
    <<: *hardened
    profiles: [tor]
    image: browser-fabric-tor:local
    build:
      context: ../..
      dockerfile: deploy/compose/tor.Dockerfile
    networks: [fabric-egress, fabric-egress-external]
    # The image runs Tor as fabric-tor. A 1777 tmpfs lets Tor recreate its private /tmp/tor-data
    # directory after the tmpfs hides the image layer.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 256m
    pids_limit: 256

  # Optional: `docker compose --profile observability up -d` adds an OpenTelemetry collector.
  fabric-observability:
    <<: *hardened
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.127.0@sha256:e94cfd92357aa21f4101dda3c0c01f90e6f24115ba91b263c4d09fed7911ae68
    user: '10001:10001'
    networks: [fabric-control]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - type: bind
        source: ../observability/otel-collector.yml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    tmpfs: *app-tmpfs
    mem_limit: 512m
    pids_limit: 256

  fabric-worker-chromium:
    <<: *worker-agent
    build:
      context: ../..
      dockerfile: workers/chromium-cdp/Dockerfile
    secrets: [fabric_worker_ca, fabric_assignment_public_key, fabric_worker_chromium_cert, fabric_worker_chromium_key, chromium_worker_enrollment]
    environment:
      <<: *worker-agent-environment
      FABRIC_WORKER_CONFIG_FILE: /etc/browser-fabric/worker.json
      FABRIC_WORKER_CLIENT_CERT_FILE: /run/secrets/fabric_worker_chromium_cert
      FABRIC_WORKER_CLIENT_KEY_FILE: /run/secrets/fabric_worker_chromium_key
      FABRIC_WORKER_ENROLLMENT_TOKEN_FILE: /run/secrets/chromium_worker_enrollment
    # Generated by bootstrap-secrets.sh: the defaults plus the catalog recipes this worker serves.
    volumes:
      - type: bind
        source: ${FABRIC_SECRETS_DIR:-./secrets}/workers/chromium.json
        target: /etc/browser-fabric/worker.json
        read_only: true

  fabric-worker-patchright:
    <<: *worker-agent
    secrets: [fabric_worker_ca, fabric_assignment_public_key, fabric_worker_patchright_cert, fabric_worker_patchright_key, patchright_worker_enrollment]
    environment:
      <<: *worker-agent-environment
      FABRIC_WORKER_CONFIG_FILE: /etc/browser-fabric/worker.json
      FABRIC_WORKER_CLIENT_CERT_FILE: /run/secrets/fabric_worker_patchright_cert
      FABRIC_WORKER_CLIENT_KEY_FILE: /run/secrets/fabric_worker_patchright_key
      FABRIC_WORKER_ENROLLMENT_TOKEN_FILE: /run/secrets/patchright_worker_enrollment
    # Generated by bootstrap-secrets.sh: the defaults plus the catalog recipes this worker serves.
    volumes:
      - type: bind
        source: ${FABRIC_SECRETS_DIR:-./secrets}/workers/patchright.json
        target: /etc/browser-fabric/worker.json
        read_only: true

  fabric-worker-rebrowser:
    <<: *worker-agent
    secrets: [fabric_worker_ca, fabric_assignment_public_key, fabric_worker_rebrowser_cert, fabric_worker_rebrowser_key, rebrowser_worker_enrollment]
    environment:
      <<: *worker-agent-environment
      FABRIC_WORKER_CONFIG_FILE: /etc/browser-fabric/worker.json
      FABRIC_WORKER_CLIENT_CERT_FILE: /run/secrets/fabric_worker_rebrowser_cert
      FABRIC_WORKER_CLIENT_KEY_FILE: /run/secrets/fabric_worker_rebrowser_key
      FABRIC_WORKER_ENROLLMENT_TOKEN_FILE: /run/secrets/rebrowser_worker_enrollment
    # Generated by bootstrap-secrets.sh: the defaults plus the catalog recipes this worker serves.
    volumes:
      - type: bind
        source: ${FABRIC_SECRETS_DIR:-./secrets}/workers/rebrowser.json
        target: /etc/browser-fabric/worker.json
        read_only: true

  # The long-lived playback worker holds an encrypted provider source only in memory. It is separate
  # from one-shot media relay containers, which receive no object-store credential.
  fabric-worker-media:
    <<: *hardened
    image: browser-fabric-media:local
    build:
      context: ../..
      dockerfile: workers/media-relay/Dockerfile
    user: '10001:10001'
    networks: [fabric-workers, fabric-egress]
    depends_on:
      fabric-worker-manager:
        condition: service_started
      fabric-egress-sidecar:
        condition: service_started
    secrets: [fabric_worker_ca, fabric_assignment_public_key, fabric_worker_media_cert, fabric_worker_media_key, media_worker_enrollment, media_worker_input_public_key, media_worker_input_private_key, fabric_media_playback_public_key]
    environment:
      FABRIC_WORKER_MANAGER_URL: https://fabric-worker-manager:8082
      FABRIC_WORKER_CLIENT_CA_FILE: /run/secrets/fabric_worker_ca
      FABRIC_WORKER_CLIENT_CERT_FILE: /run/secrets/fabric_worker_media_cert
      FABRIC_WORKER_CLIENT_KEY_FILE: /run/secrets/fabric_worker_media_key
      FABRIC_ASSIGNMENT_PUBLIC_KEY_FILE: /run/secrets/fabric_assignment_public_key
      FABRIC_WORKER_ENROLLMENT_TOKEN_FILE: /run/secrets/media_worker_enrollment
      FABRIC_INPUT_PUBLIC_KEY_FILE: /run/secrets/media_worker_input_public_key
      FABRIC_INPUT_PRIVATE_KEY_FILE: /run/secrets/media_worker_input_private_key
      FABRIC_MEDIA_PLAYBACK_PUBLIC_KEY_FILE: /run/secrets/fabric_media_playback_public_key
      # Playback upstream traffic leaves through this sidecar listener (direct by default). Point it
      # at another listener (for example the proxy listener, 11001) to give playback one egress
      # identity; FABRIC_MEDIA_DIRECT_EXCEPTION_SUFFIXES lists hosts that bypass it.
      FABRIC_EGRESS_PROXY_URL: ${FABRIC_MEDIA_EGRESS_PROXY_URL:-http://fabric-egress-sidecar:11000}
      FABRIC_EGRESS_DIRECT_PROXY_URL: http://fabric-egress-sidecar:11000
      FABRIC_MEDIA_DIRECT_EXCEPTION_SUFFIXES: ${FABRIC_MEDIA_DIRECT_EXCEPTION_SUFFIXES:-[]}
      FABRIC_WORKER_CONFIG_FILE: /etc/browser-fabric/worker.json
      PORT: '8084'
    command: [bun, workers/media-relay/src/playback-server.ts]
    volumes:
      - type: bind
        source: ${FABRIC_SECRETS_DIR:-./secrets}/workers/media.json
        target: /etc/browser-fabric/worker.json
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1770,uid=10001,gid=10001
    mem_limit: 1024m
    pids_limit: 512

  # The only Fabric listener Compose publishes. It authenticates application callers with
  # per-principal Basic credentials and speaks origin mTLS to API/CDP/media services.
  fabric-edge:
    <<: *hardened
    image: browser-fabric-edge:local
    build:
      context: ../..
      dockerfile: deploy/compose/caddy.Dockerfile
    user: '0:0'
    # The edge needs one non-internal network for Docker's port publisher. It is the only member of
    # that network; origins remain on the internal control network.
    networks: [fabric-edge, fabric-control]
    depends_on:
      fabric-api:
        condition: service_started
      fabric-cdp-gateway:
        condition: service_started
      fabric-media-playback-gateway:
        condition: service_started
    secrets: [fabric_origin_server_ca, fabric_edge_origin_client_cert, fabric_edge_origin_client_key]
    environment:
      FABRIC_API_ORIGIN: fabric-api
      FABRIC_CDP_ORIGIN: fabric-cdp-gateway
      FABRIC_MEDIA_PLAYBACK_ORIGIN: fabric-media-playback-gateway
    ports:
      - ${FABRIC_EDGE_BIND:-127.0.0.1}:${FABRIC_EDGE_PORT:-18086}:8080
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # One file per principal: `<name>` holds the password of principal_<name>.
      - type: bind
        source: ${FABRIC_SECRETS_DIR:-./secrets}/principals
        target: /run/fabric-principals
        read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,mode=1770
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=1770
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/healthz | grep -q '"status":"ok"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    pids_limit: 128

networks:
  fabric-control:
    name: ${FABRIC_DOCKER_NETWORK_CONTROL:-browser-fabric-control}
    driver: bridge
    internal: true
  fabric-edge:
    name: ${FABRIC_DOCKER_NETWORK_EDGE:-browser-fabric-edge}
    driver: bridge
    internal: false
  fabric-workers:
    name: ${FABRIC_DOCKER_NETWORK_WORKERS:-browser-fabric-workers}
    driver: bridge
    internal: true
  fabric-egress:
    name: ${FABRIC_DOCKER_NETWORK_EGRESS:-browser-fabric-egress}
    driver: bridge
    internal: true
  fabric-egress-external:
    name: ${FABRIC_DOCKER_NETWORK_EGRESS_EXTERNAL:-browser-fabric-egress-external}
    driver: bridge
    internal: false

volumes:
  fabric_postgres_data:
    name: ${FABRIC_POSTGRES_VOLUME:-browser-fabric-postgres-data}
  fabric_object_store_data:
    name: ${FABRIC_OBJECT_STORE_VOLUME:-browser-fabric-object-store-data}
  # Profile records store the unprefixed volume names; never let Compose rewrite them.
  profile_chromium:
    name: profile_chromium
  profile_interactive:
    name: profile_interactive

